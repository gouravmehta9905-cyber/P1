# Database Configuration (Using H2 In-Memory DB for easy testing without Docker)
spring.datasource.url=jdbc:h2:mem:robms_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Console at /h2-console
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show detailed error messages
server.error.include-message=always
server.error.include-binding-errors=always

# Server
server.port=8080

# JWT Secret (for development only)
jwt.secret=9a3b6f2d8e4c7a1b5c9d2e6f4a8b1c3d5e7f9a2b4c6d8e0f1a3b5c7d9e2f4a6b
jwt.expiration=86400000
