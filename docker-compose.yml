version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: robms_postgres
    environment:
      POSTGRES_USER: robms_user
      POSTGRES_PASSWORD: robms_password
      POSTGRES_DB: robms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: robms_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
